services:
  mysql:
    image: mysql:8.4
    container_name: eam-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: eam_demo
      MYSQL_USER: eam
      MYSQL_PASSWORD: eam-local-password
      MYSQL_ROOT_PASSWORD: root-local-password
      TZ: Asia/Shanghai
    ports:
      - '3306:3306'
    volumes:
      - eam_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot-local-password']
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  eam_mysql_data:
