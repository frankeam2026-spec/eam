server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
spring:
  application:
    name: equipment-ledger-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/eam_demo?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&connectionTimeZone=UTC}
    username: ${DB_USERNAME:eam}
    password: ${DB_PASSWORD:eam-local-password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'null'
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
management:
  endpoints:
    web:
      exposure:
        include: health,info
eam:
  inventory:
    preview-secret: ${EAM_INVENTORY_PREVIEW_SECRET:}
  print:
    font-path: ${EAM_PRINT_FONT:}
  upload:
    directory: ${EAM_UPLOAD_DIRECTORY:./data/uploads}
  equipment:
    states: "正常,带病运行,故障"
  security:
    demo-tenant-id: ${EAM_DEMO_TENANT_ID:10001}
    bootstrap-admin-password: ${EAM_BOOTSTRAP_ADMIN_PASSWORD:}
